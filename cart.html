<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your bag — STRYDE</title>
    <meta name="description" content="Your shopping bag." />
    <meta name="theme-color" content="#faf6f0" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="cart">
    <div data-header></div>
    <main>
      <section class="phead"><p class="kicker">Your bag</p><h1 class="h1 split">Almost <em>yours</em></h1></section>
      <section class="page">
        <div class="bag-grid">
          <div data-lines></div>
          <aside class="summary" data-summary>
            <p class="h4">Summary</p>
            <form class="promo" data-promo><label class="sr" for="promo">Promo code</label><input class="input" id="promo" placeholder="Promo code" data-promo-in /><button class="btn btn-line" type="submit">Apply</button></form>
            <p class="promo-msg" data-promo-msg></p>
            <dl class="totals" data-totals></dl>
            <a href="checkout.html" class="btn btn-ink btn-block magnet" data-checkout>Checkout</a>
            <a href="shop.html" class="btn btn-line btn-block">Keep shopping</a>
          </aside>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/pages.js"></script>
  </body>
</html>
